[package]
name = "teaksta"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
ego-tree = "0.10"
thiserror = "2"
regex = "1"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
divvun-runtime = { git = "https://github.com/divvun/divvun-runtime", default-features = false, features = ["mod-divvun", "mod-hfst", "mod-cg3"] }
futures-util = "0.3"
hfst = { git = "https://github.com/divvun/hfst-rs" }
poem = { version = "3", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
rand = "0.9"
roxmltree = "0.20"
html-escape = "0.2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
