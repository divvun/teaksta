[package]
name = "teaksta"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
blake3 = "1"
dom_smoothie = "0.18"
ego-tree = "0.10"
thiserror = "2"
regex = "1"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
divvun-runtime = { git = "https://github.com/divvun/divvun-runtime", default-features = false, features = ["mod-divvun", "mod-hfst", "mod-cg3"] }
futures-util = "0.3"
hfst = { git = "https://github.com/divvun/hfst-rs" }
poem = { version = "3", features = ["multipart", "static-files"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Pages are fetched over rustls rather than the platform's TLS, because
# verification is teaksta's own: a site that sends its certificate without
# the issuing intermediate is completed from the certificate's own issuer
# address, as browsers do, and native-tls offers no hook to do that from.
# The crypto provider is ring, already in this graph through object_store.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "system-proxy", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.18"
# Where a kept text lives. object_store (Apache Arrow) carries its own Azure
# shared-key signing, so the Azure backend costs no `azure_*` crate — which
# matters, because the `azure_storage_blobs` 0.21 stack this would otherwise
# be written against is frozen on the azure-sdk-for-rust legacy branch with no
# plans to update.
#
# The version is held on the 0.13 line deliberately. 0.14 moved to reqwest
# 0.13 and forces `aws-lc-rs` onto every cloud feature — a second vendored C
# crypto library, and a second HTTP stack beside the reqwest 0.12 the fetch
# seam already builds its one client from. 0.13 signs with `ring`, which is
# already in this graph, and takes its transport from reqwest 0.12, which is
# the one that is already here.
#
# `fs` is a default feature and is kept: it is the local backend a deployment
# without the Azure trio stores into, so dev, tests and the model suites run
# with no Azure at all.
object_store = { version = "0.13.2", features = ["azure"] }
rand = "0.9"
sanitizer = { git = "https://github.com/necessary-nu/sanitizer-rs" }
html-escape = "0.2"
toml = "0.9"
urlencoding = "2"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap"] }
encoding_rs = "0.8.41"
teaksta-l10n = { path = "../teaksta-l10n" }

[dev-dependencies]
poem = { version = "3", features = ["multipart", "static-files", "test"] }
tempfile = "3"
