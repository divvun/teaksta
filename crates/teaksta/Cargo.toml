[package]
name = "teaksta"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
ego-tree = "0.10"
thiserror = "2"
regex = "1"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
rand = "0.9"
roxmltree = "0.20"
html-escape = "0.2"
urlencoding = "2"
