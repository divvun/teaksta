# The topic registry.
#
# One `[[topic]]` per topic the server offers. This file is compiled into the
# binary with `include_str!`, so a build carries a working registry with no
# tree beside it; `TEAKSTA_TOPICS` names a file to read instead, for a
# deployment that wants to retune without a rebuild.
#
# Every value below was extracted from the Java deployment this server
# replaces, where a topic was spread over three files: `activity.xml` under
# `sme/src/main/webapp/activities/<name>/`, the UIMA aggregate descriptor it
# named under `sme/desc/operators/`, and the delegate descriptor under
# `sme/desc/enhancers/`. Those paths name the Java tree the port read them
# out of, which is in this repository's history rather than its working tree.
# Each value carries the file it came from.
#
# Fields:
#   name       the registry name. `/api/activities` serves it, an enhancement
#              request names the topic by it, and the enhancer marks its hits
#              `teaksta-<name>` — the client derives that class from the name
#              it was served, so the two cannot drift apart.
#              From `<meta><name>` in `activity.xml`, which the Java also
#              required to equal the activity's directory name.
#   label      the North Sámi name, shown to the learner. From the
#              `SAMI_LABELS` table the port carried in `util/html_enhancer.rs`.
#   enabled    what `activity.xml`'s `<activity enabled="...">` declared. Every
#              shipped topic declares `yes`. Served as-is; the server does not
#              yet refuse a request for a disabled topic, exactly as it did not
#              before.
#   enhancer   which enhancer drives the topic — the delegate the aggregate
#              descriptor's `<fixedFlow>` ran after `TokenEnhancer`.
#   tags       that enhancer's own tag list. Each enhancer declares the
#              parameter under a name of its own (`NTags`, `connegTags`, ...);
#              the live value is the `<entry>` the topic's `activity.xml` laid
#              over the delegate default, which is what the running server used.
#   token_tags the `Tags` parameter of the `TokenEnhancer` that runs ahead of
#              the topic's enhancer, from the aggregate descriptor's
#              `<configurationParameterSettings>`. It decides which tokens the
#              generic enhancer marks as carrying a part of speech, and it
#              genuinely varies per topic.
#   use_lemma_filter
#              the `TokenEnhancer` `UseLemmaFilter` parameter. Optional,
#              defaulting to `false`, which is the delegate default in
#              `sme/desc/enhancers/TokenEnhancer.xml` and the value every
#              shipped topic ran with: no aggregate descriptor overrides it.
#   text       the ready-made texts the topic offers, one `[[topic.text]]`
#              each, shown in the order written: `title`, `url` (http or
#              https), `genre` (story, folktale, factual or textbook — in the
#              webapp's words muitalus, máinnas, áššeteaksta and
#              oahppogirjeteaksta), `words` (about how many) and, optionally,
#              `tense` (present or past), the tense the text's verbs are in.
#              From `activities/<name>/recommended_pages.html`, which six
#              topics had. Those were links to pages elsewhere and these are
#              too: a text whose site is down cannot be read, and the learner
#              is told so.
#
# Not carried over: the `<client-cfg>` block every `activity.xml` holds. It is
# ten copies of the same inline CSS for a browser add-on that no longer
# exists, and the Java's own reader of it was commented out, so nothing has
# read those entries for as long as the file has had them.
#
# The preprocessing pipeline — relevance, tokenizer, sentence detection, HTML
# sentences, constraint grammar — is the same for every topic and is not
# configuration. It is built in `pipeline/flow.rs`. The `vislcg3Pipe.xml`
# parameters that named the `vislcg3` binary and its two grammars are absent
# for the same reason: the constraint-grammar stage is in-process now and
# loads its grammars from the model bundle.

[[topic]]
name = "Adverbial"
label = "Adverbiála"
enabled = true
enhancer = "adverbial"
# from activities/Adverbial/activity.xml <post> entry AdvTags
tags = "ADVL,mod_advl,compl_advl,coor_advl"
# from desc/operators/vislcg3PostProc_Adv.xml Tags
token_tags = "ADVL"

[[topic]]
name = "Conjunctions"
label = "Konjunkšuvnnat"
enabled = true
enhancer = "conjunction"
# from activities/Conjunctions/activity.xml <post> entry conjunctionTags
tags = "CC,CS"
# from desc/operators/vislcg3PostProc.xml Tags
token_tags = "CC,CS"

[[topic]]
name = "InfiniteVerbs"
label = "Infinihtta vearbbat"
enabled = true
enhancer = "infinite-verb"
# from activities/InfiniteVerbs/activity.xml <post> entry infiniteverbTags
tags = "PrfPrc, VGen, VAbess, Ger, Actio Ess, Inf, ConNeg"
# from desc/operators/vislcg3PostProc_InfiniteVerb.xml Tags
token_tags = "V PrfPrc, V VGen, V VAbess, V Ger, V Actio Ess, V Der/PassL V Inf"

