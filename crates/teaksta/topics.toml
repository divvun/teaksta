[[topic]]
name = "Substantive"
label = "Substantiivvat"
enabled = true
enhancer = "noun"
# from activities/Substantive/activity.xml <post> entry NTags. The tag `N`
# itself is not listed: the enhancer checks for it separately, because it does
# not always immediately precede the number and case tags.
tags = "Sg Nom, Sg Acc, Sg Gen, Sg Ill, Sg Loc, Sg Com, Pl Nom, Pl Acc, Pl Gen, Pl Ill, Pl Loc, Pl Com, Ess, Prop Sem/Mal Attr, Prop Sem/Fem Attr, Prop Sem/Sur Attr"
# from desc/operators/vislcg3PostProc_Noun.xml Tags. Placeholder text in the
# original, kept verbatim because it is what the deployment ran: no North Sámi
# reading carries either tag, so the generic enhancer marks every token it
# wraps as carrying no part of speech, and the topic's own hits are the
# enhancer's alone. The commented-out alternative beside it in the descriptor
# was never in effect.
token_tags = "blah,blubb"

