[package]
name = "teaksta-web"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

# The browser fetch client only exists on wasm; the native build of this crate
# is a type/logic check, so the dependency stays off the host target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
